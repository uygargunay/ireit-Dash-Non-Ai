name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Structural verification
        run: python tests/verify_v2.py

      - name: JavaScript syntax
        run: |
          node --check src/IreiMvp.Web/wwwroot/app.js
          node --check src/IreiMvp.Web/wwwroot/admin.js

      - name: Restore
        run: dotnet restore IreiMvp.sln

      - name: Build
        run: dotnet build IreiMvp.sln --configuration Release --no-restore

      - name: API smoke test
        run: bash tests/smoke_api.sh
